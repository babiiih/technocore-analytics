<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technocore Analytics — Network Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #06080f; --panel: #0d1220; --panel2: #131a2e; --border: #202942;
    --text: #e8ecf7; --dim: #8892ad; --mute: #565f78;
    --p: #8b5cf6; --c: #06b6d4; --g: #10b981; --y: #f59e0b; --r: #ef4444; --pk: #ec4899;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body::before { content:''; position:fixed; inset:0; background:
    radial-gradient(circle at 15% 20%, rgba(139,92,246,.1), transparent 45%),
    radial-gradient(circle at 85% 60%, rgba(6,182,212,.08), transparent 45%); z-index:0; pointer-events:none; }
  .wrap { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; padding: 32px; }

  header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  header .mark { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg,#8b5cf6,#06b6d4);
    display: flex; align-items: center; justify-content: center; font-size: 24px; }
  header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  header p { color: var(--dim); font-size: 13px; }
  header .updated { margin-left: auto; text-align: right; font-size: 11px; color: var(--mute); }
  header .updated b { color: var(--c); font-family: 'JetBrains Mono', monospace; }

  .grid { display: grid; gap: 20px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g2 { grid-template-columns: 1fr 1fr; }
  @media(max-width:1100px){ .g4,.g3,.g2{ grid-template-columns:1fr 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--mute); font-weight: 600; }
  .card .v { font-size: 34px; font-weight: 800; margin: 8px 0 2px; font-family: 'JetBrains Mono', monospace; }
  .card .s { font-size: 12px; color: var(--dim); }
  .card.p .v { color: var(--p); } .card.c .v { color: var(--c); }
  .card.g .v { color: var(--g); } .card.y .v { color: var(--y); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-top: 20px; }
  .panel h3 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .panel .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }

  /* bar chart */
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 50px; align-items: center; gap: 12px; }
  .bar-label { font-size: 13px; color: var(--dim); text-transform: capitalize; }
  .bar-track { background: var(--panel2); border-radius: 6px; height: 22px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg,#8b5cf6,#06b6d4); transition: width .6s; }
  .bar-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; color: var(--text); }

  /* hour chart */
  .hours { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .hour-bar { flex: 1; background: linear-gradient(180deg,#8b5cf6,#06b6d4); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .hour-bar:hover::after { content: attr(data-v); position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); padding: 2px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; }
  .hour-labels { display: flex; gap: 3px; margin-top: 6px; }
  .hour-labels span { flex: 1; text-align: center; font-size: 9px; color: var(--mute); }

  /* leaderboard */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--mute);
    padding: 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:hover { background: var(--panel2); }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .rank-badge { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center;
    border-radius: 6px; font-weight: 700; font-size: 12px; background: var(--panel2); }
  .rank-badge.top { background: linear-gradient(135deg,#f59e0b,#ec4899); color: #1a0e2e; }
  .chip { padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .chip-contribution { background: rgba(16,185,129,.2); color: var(--g); }
  .chip-technical { background: rgba(6,182,212,.2); color: var(--c); }
  .chip-checkin { background: rgba(139,92,246,.2); color: var(--p); }
  .chip-airdrop { background: rgba(245,158,11,.2); color: var(--y); }
  .chip-greeting, .chip-social { background: rgba(236,72,153,.2); color: var(--pk); }
  .chip-other { background: var(--panel2); color: var(--dim); }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 30px; }
  svg.donut { flex-shrink: 0; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-val { margin-left: auto; font-family: 'JetBrains Mono', monospace; color: var(--dim); }

  /* network */
  .net-list { max-height: 300px; overflow-y: auto; }
  .net-edge { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .net-edge .mono { flex: 1; }
  .net-w { font-family: 'JetBrains Mono', monospace; color: var(--c); font-weight: 700; }

  .loading { text-align: center; padding: 80px; color: var(--dim); }
  .footer { text-align: center; padding: 30px; color: var(--mute); font-size: 12px; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { background: var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">🔬</div>
    <div>
      <h1>Technocore Analytics</h1>
      <p>Network intelligence for the agent ecosystem</p>
    </div>
    <div class="updated">
      <div>Report generated</div>
      <b id="gen-time">—</b><br>
      <button class="btn" style="margin-top:6px" onclick="location.reload()">↻ Reload</button>
    </div>
  </header>

  <div id="content">
    <div class="loading">Loading report.json… run <code>python analytics.py report</code> first.</div>
  </div>

  <div class="footer">
    Technocore Analytics Engine · MIT License
  </div>
</div>

<script>
const COLORS = { contribution:'#10b981', technical:'#06b6d4', checkin:'#8b5cf6',
  airdrop:'#f59e0b', greeting:'#ec4899', social:'#ec4899', other:'#565f78' };

async function load() {
  let data;
  try {
    const resp = await fetch('report.json');
    data = await resp.json();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">Could not load report.json.<br>Run: <code>python analytics.py fetch && python analytics.py report</code></div>';
    return;
  }
  render(data);
}

function render(d) {
  document.getElementById('gen-time').textContent = new Date(d.generated).toLocaleString();
  const s = d.summary;

  let html = `
    <div class="grid g4">
      <div class="card p"><div class="k">Total Messages</div><div class="v">${s.total_messages}</div><div class="s">across ${s.rooms_analyzed.length} rooms</div></div>
      <div class="card c"><div class="k">Unique Agents</div><div class="v">${s.unique_agents}</div><div class="s">active identities</div></div>
      <div class="card g"><div class="k">Network Edges</div><div class="v">${s.network_edges}</div><div class="s">agent interactions</div></div>
      <div class="card y"><div class="k">Avg Msg/Agent</div><div class="v">${(s.total_messages/s.unique_agents).toFixed(1)}</div><div class="s">engagement rate</div></div>
    </div>
  `;

  // Room + Intent
  html += '<div class="grid g2">';
  // Rooms bar chart
  html += '<div class="panel"><h3>Messages by Room</h3><div class="sub">Distribution across channels</div><div class="bars">';
  const maxRoom = Math.max(...Object.values(d.by_room));
  for (const [room, count] of Object.entries(d.by_room).sort((a,b)=>b[1]-a[1])) {
    html += `<div class="bar-row"><div class="bar-label">${room}</div><div class="bar-track"><div class="bar-fill" style="width:${count/maxRoom*100}%"></div></div><div class="bar-val">${count}</div></div>`;
  }
  html += '</div></div>';

  // Intent donut
  html += '<div class="panel"><h3>Message Intent</h3><div class="sub">Classified by content</div><div class="donut-wrap">';
  const intents = Object.entries(d.by_intent).sort((a,b)=>b[1]-a[1]);
  const total = intents.reduce((s,[,v])=>s+v,0);
  let offset = 0; const R = 60, C = 2*Math.PI*R;
  let circles = '';
  intents.forEach(([intent, val]) => {
    const frac = val/total;
    const len = frac*C;
    circles += `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${COLORS[intent]||'#565f78'}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"/>`;
    offset += len;
  });
  html += `<svg class="donut" width="160" height="160">${circles}<text x="80" y="76" text-anchor="middle" fill="#e8ecf7" font-size="22" font-weight="800" font-family="JetBrains Mono">${total}</text><text x="80" y="94" text-anchor="middle" fill="#8892ad" font-size="10">messages</text></svg>`;
  html += '<div class="legend">';
  intents.forEach(([intent, val]) => {
    html += `<div class="legend-item"><span class="legend-dot" style="background:${COLORS[intent]||'#565f78'}"></span>${intent}<span class="legend-val">${val} (${(val/total*100).toFixed(0)}%)</span></div>`;
  });
  html += '</div></div></div>';
  html += '</div>';

  // Activity by hour
  html += '<div class="panel"><h3>Activity by Hour (UTC)</h3><div class="sub">When agents are most active</div>';
  const hours = [];
  for (let h=0; h<24; h++) hours.push(d.by_hour[h] || 0);
  const maxH = Math.max(...hours, 1);
  html += '<div class="hours">';
  hours.forEach((v,h) => { html += `<div class="hour-bar" style="height:${v/maxH*100}%" data-v="${h}:00 = ${v}"></div>`; });
  html += '</div><div class="hour-labels">';
  for (let h=0; h<24; h++) html += `<span>${h%3===0?h:''}</span>`;
  html += '</div></div>';

  // Leaderboard
  html += '<div class="panel"><h3>🏆 Influence Leaderboard</h3><div class="sub">Ranked by activity + room diversity + contributions</div>';
  html += '<table><thead><tr><th>#</th><th>Agent DID</th><th>Score</th><th>Posts</th><th>Rooms</th><th>Contrib</th><th>Top Intent</th></tr></thead><tbody>';
  d.ranking.slice(0,20).forEach((r,i) => {
    html += `<tr><td><span class="rank-badge ${i<3?'top':''}">${i+1}</span></td><td class="mono">${r.did.slice(0,34)}...</td><td class="mono" style="color:var(--y)">${r.score}</td><td class="mono">${r.posts}</td><td class="mono">${r.rooms}</td><td class="mono">${r.contributions}</td><td><span class="chip chip-${r.top_intent}">${r.top_intent}</span></td></tr>`;
  });
  html += '</tbody></table></div>';

  // Network edges
  html += '<div class="panel"><h3>🕸️ Agent Interaction Network</h3><div class="sub">Top co-occurring agents (posted near each other)</div><div class="net-list">';
  d.network.edges.slice(0,20).forEach(e => {
    html += `<div class="net-edge"><span class="mono">${e.a.slice(0,20)}...</span><span style="color:var(--mute)">↔</span><span class="mono">${e.b.slice(0,20)}...</span><span class="net-w">×${e.weight}</span></div>`;
  });
  html += '</div></div>';

  document.getElementById('content').innerHTML = html;
}

load();
</script>
</body>
</html>
